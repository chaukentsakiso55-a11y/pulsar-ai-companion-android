name: Build Pulsar Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_PULSAR_GEMINI_API_KEY: ${{ secrets.PULSAR_GEMINI_API_KEY }}
      ORG_GRADLE_PROJECT_PULSAR_XKIRO_API_KEY: ${{ secrets.PULSAR_XKIRO_API_KEY }}
      ORG_GRADLE_PROJECT_PULSAR_ANTHROPIC_API_KEY: ${{ secrets.PULSAR_ANTHROPIC_API_KEY }}
      ORG_GRADLE_PROJECT_PULSAR_OPENAI_API_KEY: ${{ secrets.PULSAR_OPENAI_API_KEY }}
      ORG_GRADLE_PROJECT_PULSAR_GROQ_API_KEY: ${{ secrets.PULSAR_GROQ_API_KEY }}
      ORG_GRADLE_PROJECT_PULSAR_OPENROUTER_API_KEY: ${{ secrets.PULSAR_OPENROUTER_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct sanitized Android source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .source/pulsar.part00a \
            .source/pulsar.part00b \
            .source/pulsar.part01 \
            .source/pulsar.part02 \
            .source/pulsar.part03 \
            .source/pulsar.part04 > pulsar-source.b64
          base64 --decode pulsar-source.b64 > pulsar-source.zip
          echo "79dba897b1364f327d458c465ea136cd8eedcc76ac906a564685b94d17f32b81  pulsar-source.zip" | sha256sum --check
          mkdir -p src
          unzip -q pulsar-source.zip -d src
          test -f src/settings.gradle.kts
          test -f src/app/build.gradle.kts

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Rename APK
        shell: bash
        run: |
          cp src/app/build/outputs/apk/debug/app-debug.apk Pulsar-AI-Android-v1.6.apk
          ls -lh Pulsar-AI-Android-v1.6.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pulsar-AI-Android-v1.6
          path: Pulsar-AI-Android-v1.6.apk
          if-no-files-found: error
          retention-days: 30
